<!DOCTYPE HTML>
<html lang="en">
    {{ partial "head.html" . }}
    <body class="h-card">
        {{ partial "global-nav.html" . }}
        {{ block "main" . }}
        <!-- The part of the page that begins to differ between templates -->
        {{ end }}
        {{ partialCached "footer.html" . }}

        {{ if .Store.Get "hasMermaid" }}
        <script type="module">
            import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
            /* stop mermaid rendering on the page load event (with its default theme) while waiting for fonts below */
            mermaid.initialize({ startOnLoad: false });
            /* use the body font, loaded first so mermaid measures text with it, and the sizes set in main.css */
            await document.fonts.ready;
            const css = getComputedStyle(document.documentElement);
            const fontFamily = getComputedStyle(document.body).fontFamily;
            const classFontSize = css.getPropertyValue("--mermaid-class-font-size").trim() || "16px";
            const scale = parseFloat(css.getPropertyValue("--mermaid-scale")) || 1;
            const nodes = [...document.querySelectorAll("pre.mermaid")];
            const isClass = n => n.textContent.trim().startsWith("classDiagram");
            mermaid.initialize({ startOnLoad: false, theme: "neutral", themeVariables: { fontFamily } });
            await mermaid.run({ nodes: nodes.filter(n => !isClass(n)) });
            mermaid.initialize({ startOnLoad: false, theme: "neutral", themeVariables: { fontFamily, fontSize: classFontSize } });
            await mermaid.run({ nodes: nodes.filter(isClass) });
            /* scale each diagram's natural size by --mermaid-scale */
            document.querySelectorAll("pre.mermaid svg").forEach(svg => {
                svg.style.maxWidth = (svg.viewBox.baseVal.width * scale) + "px";
            });
        </script>
        {{ end }}

        <!-- Add external relative attribute to external links. This is used to render an external link icon
            after the link and also to trap external navigation with google analytics -->
        <script>
            // Get all links on the page
            Array.from(document.getElementsByTagName('a'))

                // Filter for outbound links
                .filter(link =>
                    ((link.href.indexOf(location.host) > 8 || link.href.indexOf(location.host) === -1) &&
                    (link.href.match(/^http:/i) || link.href.match(/^https:/i)))
                    || link.href.match(/^mailto:/i)
                )

                // For each external link
                .forEach(externalLink => {

                    // Set rel attribute as external to ensure styling applied
                    if (externalLink.rel && externalLink.rel !== '') {
                        externalLink.rel += " external";
                    }
                    else {
                        externalLink.rel = "external";
                    }

                    // Save old onclick handler (if it exists) and install new one
                    let oldOnClick = externalLink.onclick;
                    externalLink.onclick = function(event) {

                        // Test if Google Analytics loaded
                        if (window.ga && ga.create) {

                            // Send tracking event
                            gtag('event', 'click', {
                                'event_category': 'outbound',
                                'event_label': externalLink.href,
                                'transport_type': 'beacon',
                                'event_callback': function() {
                                    document.location = externalLink.href;
                                }
                            });
                        }
                        else {
                            document.location = externalLink.href;
                        }

                        // Invoke replaced onclick handler if it existed
                        if (oldOnClick) {
                            return oldOnClick.call(this, event);
                        }
                        return false;
                    }
                });
        </script>
    </body>
</html>
